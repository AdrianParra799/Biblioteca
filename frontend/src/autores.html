<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Autores - Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container mt-5">
    <h1 class="mb-4">Gestión de autores</h1>

    <form id="formularioAutor" class="mb-4">
      <input type="hidden" id="autorId">

      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control">
      </div>

      <div class="mb-3">
        <label for="nacionalidad" class="form-label">Nacionalidad</label>
        <input type="text" id="nacionalidad" class="form-control">
      </div>

      <div class="mb-3">
        <label for="anioNacimiento" class="form-label">Año de nacimiento</label>
        <input type="number" id="anioNacimiento" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary">Guardar autor</button>
      <button type="button" id="botonCancelar" class="btn btn-secondary">Cancelar</button>
    </form>

    <h2 class="mb-3">Listado de autores</h2>

    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Nacionalidad</th>
          <th>Año de nacimiento</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaAutores">
      </tbody>
    </table>

    <a href="./index.html" class="btn btn-secondary">Volver al inicio</a>
  </main>

  <script type="module" src="./autores.js"></script>
</body>
</html>
