<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libros - Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container mt-5">
    <h1 class="mb-4">Gestión de libros</h1>

    <form id="formularioLibro" class="mb-4">
      <input type="hidden" id="libroId">

      <div class="mb-3">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" id="titulo" class="form-control">
      </div>

      <div class="mb-3">
        <label for="genero" class="form-label">Género</label>
        <input type="text" id="genero" class="form-control">
      </div>

      <div class="mb-3">
        <label for="anioPublicacion" class="form-label">Año de publicación</label>
        <input type="number" id="anioPublicacion" class="form-control">
      </div>

      <div class="mb-3">
        <label for="autorId" class="form-label">Autor</label>
        <select id="autorId" class="form-select">
          <option value="">Selecciona un autor</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success">Guardar libro</button>
      <button type="button" id="botonCancelar" class="btn btn-secondary">Cancelar</button>
    </form>

    <h2 class="mb-3">Listado de libros</h2>

    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Título</th>
          <th>Género</th>
          <th>Año de publicación</th>
          <th>Autor</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaLibros">
      </tbody>
    </table>

    <a href="./index.html" class="btn btn-secondary">Volver al inicio</a>
  </main>

  <script type="module" src="./libros.js"></script>
</body>
</html>
